name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:   # bisa trigger manual dari GitHub UI

jobs:
  # ── Build macOS (arm64 untuk M1/M2/M3) ─────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Build macOS DMG (arm64)
        run: npx electron-builder --mac --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-dmg
          path: dist-electron/*.dmg
          retention-days: 30

  # ── Build Windows (.exe) ────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Build Windows NSIS installer
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: |
            dist-electron/*.exe
            dist-electron/*.msi
          retention-days: 30

  # ── Buat GitHub Release saat ada tag v* ────────────────────────────────────
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Church Slide Manager ${{ github.ref_name }}
          body: |
            ## 🎵 Church Slide Manager ${{ github.ref_name }}

            ### Download
            - **macOS (Apple Silicon M1/M2/M3)**: `Church Slide Manager-*-arm64.dmg`
            - **Windows 10/11 (64-bit)**: `Church Slide Manager Setup *.exe`

            ### Instalasi macOS
            1. Buka file `.dmg`
            2. Drag ke Applications
            3. Pertama buka: klik kanan → Open (bypass Gatekeeper)

            ### Instalasi Windows
            1. Jalankan file `.exe`
            2. Ikuti wizard instalasi
          files: |
            mac-arm64-dmg/*.dmg
            windows-x64-installer/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
