<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      -webkit-app-region: drag;
    }
    .icon {
      width: 72px;
      height: 72px;
      background: #0284c7;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 36px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #f1f5f9;
    }
    p {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 28px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #1e293b;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      margin-top: 14px;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="icon">🎵</div>
  <h1>Church Slide Manager</h1>
  <p>Menyiapkan aplikasi...</p>
  <div class="spinner"></div>
  <p class="status" id="status">Menjalankan server...</p>
  <script>
    let dot = 0;
    const messages = ['Menjalankan server', 'Memuat database', 'Menyiapkan koneksi', 'Hampir selesai'];
    let i = 0;
    setInterval(() => {
      document.getElementById('status').textContent = messages[i % messages.length] + '...';
      i++;
    }, 1200);
  </script>
</body>
</html>
